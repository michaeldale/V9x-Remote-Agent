name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history and tags, so the notes step can find the previous
          # release tag.
          fetch-depth: 0

      - uses: open-watcom/setup-watcom@v1
        with:
          version: "2.0"

      - name: Build release artifacts
        shell: powershell
        run: .\scripts\make-release.ps1

      - name: Extract changelog sections for release notes
        shell: powershell
        run: |
          # The public repo does not get every version, so the notes cover
          # every CHANGELOG section newer than the previous release tag. With
          # no previous tag, or one the changelog does not name, only the top
          # section is used.
          $lines = Get-Content CHANGELOG.md
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^## ') { $start = $i; break }
          }
          if ($start -lt 0) { throw 'No release section found in CHANGELOG.md.' }
          # Highest v* tag reachable from the parent commit. Avoids describe,
          # whose stderr on "no tag" is terminating under PowerShell 5.1.
          # Collect the whole list first: Select-Object -First in the pipe
          # stops git early and leaves $LASTEXITCODE at -1.
          $tags = @(git tag --merged "${{ github.ref_name }}^" --list 'v*' --sort=-v:refname)
          $previous = ''
          if ($LASTEXITCODE -eq 0 -and $tags.Count -gt 0) { $previous = $tags[0] }
          $end = -1
          if ($previous) {
            $previousVersion = [regex]::Escape($previous.Trim().TrimStart('v'))
            for ($i = $start + 1; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match "^## $previousVersion(\s|$)") { $end = $i; break }
            }
          }
          $notes = @()
          if ($end -gt $start) {
            $count = @($lines[$start..($end - 1)] | Where-Object { $_ -match '^## ' }).Count
            if ($count -gt 1) {
              $notes += "Everything since $($previous.Trim()), newest first."
              $notes += ''
            }
          } else {
            $end = $lines.Count
            for ($i = $start + 1; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '^## ') { $end = $i; break }
            }
          }
          $notes += $lines[$start..($end - 1)]
          # UTF-8 without a BOM: Set-Content -Encoding UTF8 on 5.1 writes one,
          # and it ends up as the first character of the release body.
          [IO.File]::WriteAllLines((Join-Path $PWD 'build\release\NOTES.md'), [string[]]$notes,
            (New-Object Text.UTF8Encoding($false)))

      - name: Create GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem build\release\v9xremote-*.zip | Select-Object -First 1
          # The self-update package. Its SIGNED.TXT is added afterwards from
          # the developer's PC (scripts\sign-release.ps1): the signing key
          # never comes near CI.
          $update = Get-ChildItem build\release\v9x-remote-agent-*-win32.zip | Select-Object -First 1
          $assets = @($zip.FullName, 'build\release\V9XREMOTE.ISO', $update.FullName, 'build\release\SHA256SUMS')
          # Re-running this job must not fail just because the release exists,
          # which is what a rerun after any later-step failure would hit. Only
          # the assets are replaced; an existing title and body are left alone
          # in case a human wrote them.
          gh release view "${{ github.ref_name }}" --json tagName | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release ${{ github.ref_name }} already exists; replacing its assets."
            gh release upload "${{ github.ref_name }}" $assets --clobber
            if ($LASTEXITCODE -ne 0) { exit 1 }
          } else {
            gh release create "${{ github.ref_name }}" `
              $assets `
              --title "V9x Remote Agent ${{ github.ref_name }}" `
              --notes-file build\release\NOTES.md
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
