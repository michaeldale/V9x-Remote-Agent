[agent]
port=9869
bind_address=0.0.0.0
allowed_client=
; 0 refuses anything that starts a DOS virtual machine (COMMAND.COM shells,
; console and DOS programs; on Windows 2000 only DOS and Win16 programs);
; some display drivers corrupt the screen when one
; starts.
allow_dos_vm=1
; 1 advertises the agent on the LAN over mDNS/DNS-SD (_v9xremote._tcp) so a
; host can find it with "v9xctl discover". SETUP.EXE ticks this by default.
discovery=0
; Generated by SETUP.EXE or on the agent's first start; identifies this
; install when its IP address changes. Delete the line to get a new one.
install_id=
; Seconds a connection may send nothing before the agent closes it (0 never).
; A connection running an exec is never closed for being idle.
idle_timeout=300
log_level=info

[vnc]
; V9XVNC.EXE, the VNC (RFB) server for live remote control. Off unless
; enabled=1, which SETUP.EXE's VNC option sets (it also starts the server at
; each logon). It honours [agent] bind_address and allowed_client. poll_ms
; is how often it checks the screen for changes while a viewer is waiting
; (20-2000). password (at most 8 characters, set in SETUP.EXE) makes viewers
; use VNC authentication; blank means none. It guards screen and input only:
; the agent, which can read this file, has no authentication at all.
enabled=0
port=5900
poll_ms=100
password=

[remote]
; Remote help (docs\remote-help.md): lend this machine to the agent's
; developer over the Internet. Off unless mode=on, which SETUP.EXE /remote
; (tray: "Remote help...") sets after explaining what it allows. Commands
; are signed on the developer's PC and checked here; the tray's "Pause
; remote help" blocks them until the agent restarts. machine_id and secret
; are issued by the server at registration.
mode=off
display_name=
github=
email=

[update]
; 1 checks the update server quietly a minute after the agent starts; the
; tray menu then offers "Install update x.y.z...". Nothing is installed
; without a click, and only a release signed with the key in the agent.
check_on_startup=0
