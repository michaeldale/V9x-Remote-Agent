[agent]
port=9869
bind_address=0.0.0.0
allowed_client=
; 0 refuses anything that starts a DOS virtual machine (COMMAND.COM shells,
; console and DOS programs; on Windows 2000 only DOS and Win16 programs);
; some display drivers corrupt the screen when one
; starts.
allow_dos_vm=1
; 1 advertises the agent on the LAN over mDNS/DNS-SD (_v9xremote._tcp) so a
; host can find it with "v9xctl discover". SETUP.EXE ticks this by default.
discovery=0
; Generated by SETUP.EXE or on the agent's first start; identifies this
; install when its IP address changes. Delete the line to get a new one.
install_id=
; Seconds a connection may send nothing before the agent closes it (0 never).
; A connection running an exec is never closed for being idle.
idle_timeout=300
log_level=info
