; Watt-32 TCP/IP configuration for the v9x DOS agent.
; Watt-32 reads this file from the directory named by the WATTCP.CFG environment
; variable (set SET WATTCP.CFG=C:\V9XREMOT in AUTOEXEC.BAT), or from the current
; directory. A packet driver for the NIC must already be loaded.
;
; --- Static IP (recommended for an 86Box SLiRP/NAT lab) ---
; 86Box SLiRP hands out 10.0.2.15, gateway 10.0.2.2. An NE2000 packet driver
; such as NE2000.COM 0x60 0x0A 0x300 is a typical AUTOEXEC line before this.
my_ip   = 10.0.2.15
netmask = 255.255.255.0
gateway = 10.0.2.2
;
; --- DHCP alternative ---
; Comment out the three lines above and uncomment the next line instead:
; my_ip = dhcp
